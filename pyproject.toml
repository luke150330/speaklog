[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speaklog"
version = "0.1.0"
description = "Evidence-linked, local-first server log explanations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "LukeTeam"}]
dependencies = []

[project.scripts]
speaklog = "speaklog.cli:main"

[tool.setuptools.packages.find]
include = ["speaklog*"]
